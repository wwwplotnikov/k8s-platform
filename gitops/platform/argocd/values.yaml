global:
  domain: argocd.k8sk8s.ru

configs:
  params:
    server.insecure: true    # TLS терминируется на ingress-nginx

server:
  ingress:
    enabled: false           # включим, когда заработает DNS и cert-manager

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

applicationSet:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi

dex:
  enabled: false             # SSO не нужен, экономим ресурсы

redis:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi
