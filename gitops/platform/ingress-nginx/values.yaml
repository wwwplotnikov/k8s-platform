controller:
  replicaCount: 2

  service:
    type: LoadBalancer
    externalTrafficPolicy: Cluster

  config:
    use-forwarded-headers: "true"
    enable-real-ip: "true"
    ssl-redirect: "true"

  ingressClassResource:
    name: nginx
    enabled: true
    default: true

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
          app.kubernetes.io/component: controller

  admissionWebhooks:
    enabled: true

defaultBackend:
  enabled: false
